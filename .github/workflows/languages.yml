
name: Update Language Breakdown

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate language chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import html

          token = os.environ["GH_TOKEN"]
          username = "PXRI-hub"
          totals = {}

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "profile-language-chart"
                  }
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          page = 1

          while True:
              repos = get_json(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not repos:
                  break

              for repo in repos:
                  if repo["fork"] or repo["archived"]:
                      continue

                  languages = get_json(repo["languages_url"])

                  for language, bytes_count in languages.items():
                      totals[language] = (
                          totals.get(language, 0) + bytes_count
                      )

              page += 1

          total = sum(totals.values())

          if total == 0:
              raise RuntimeError("No language data found.")

          top = sorted(
              totals.items(),
              key=lambda item: item[1],
              reverse=True
          )[:8]

          colors = [
              "#3b82f6", "#60a5fa", "#22d3ee",
              "#a78bfa", "#34d399", "#f59e0b",
              "#fb7185", "#94a3b8"
          ]

          width = 700
          height = 95 + len(top) * 42

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" '
              'rx="12" fill="#0d1117" stroke="#3b82f6"/>',
              '<text x="25" y="38" fill="#60a5fa" '
              'font-size="20" font-family="Arial" '
              'font-weight="bold">Most Used Languages</text>'
          ]

          for i, (language, amount) in enumerate(top):
              percent = amount / total * 100
              y = 72 + i * 42
              bar_width = 420 * amount / total
              color = colors[i]

              svg.extend([
                  f'<text x="25" y="{y}" fill="#e6edf3" '
                  f'font-size="14" font-family="Arial">'
                  f'{html.escape(language)}</text>',

                  f'<text x="650" y="{y}" '
                  f'text-anchor="end" fill="#e6edf3" '
                  f'font-size="14" font-family="Arial">'
                  f'{percent:.1f}%</text>',

                  f'<rect x="205" y="{y-13}" '
                  f'width="420" height="12" rx="6" '
                  f'fill="#21262d"/>',

                  f'<rect x="205" y="{y-13}" '
                  f'width="{bar_width:.2f}" height="12" '
                  f'rx="6" fill="{color}"/>'
              ])

          svg.append("</svg>")

          with open("profile/languages.svg", "w") as file:
              file.write("\n".join(svg))
          PY

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg
          git diff --cached --quiet || git commit -m "Update language breakdown"
          git push
